services:
  unical:
    build: .
    container_name: unical
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # ===== 飞书配置 =====
      - CALENDAR_PROVIDER=feishu
      - NEXT_PUBLIC_CALENDAR_PROVIDER=feishu
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_REDIRECT_URI=${FEISHU_REDIRECT_URI}
      - FEISHU_SCOPES=calendar:calendar:read calendar:calendar.event:read calendar:calendar.event:create calendar:calendar.free_busy:read offline_access
      # ===== LLM 配置（留空则用户需自带 Key）=====
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # ===== 安全配置 =====
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # ===== 访问控制（可选）=====
      - ALLOWED_OPEN_IDS=${ALLOWED_OPEN_IDS:-}
      - DATABASE_URL=./data/unical.db
    volumes:
      - unical-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  unical-data:
